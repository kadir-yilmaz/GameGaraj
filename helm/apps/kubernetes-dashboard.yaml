apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://registry.k8s.io/dashboard/kubernetes-dashboard
    targetRevision: 7.6.1
    helm:
      values: |
        app:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        api:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        web:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        metricsScraper:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        auth:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        kong:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m