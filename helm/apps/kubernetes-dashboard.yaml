apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: registry-k8s-io.github.io/dashboard
    targetRevision: 7.6.1
    chart: kubernetes-dashboard
    helm:
      values: |
        app:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
        api:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
        web:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
        metricsScraper:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
        auth:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
        kong:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m