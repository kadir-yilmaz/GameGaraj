apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 65.2.0
    chart: kube-prometheus-stack
    helm:
      values: |
        # --- K3s'te erisilemeyen bilesenler (surekli sahte alarm uretir) ---
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false

        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 15d
            retentionSize: 8GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            nodeSelector:
              kubernetes.io/hostname: kadirserver

        alertmanager:
          alertmanagerSpec:
            replicas: 1
            # Secret: GitHub workflow olusturur (monitoring/alertmanager-telegram)
            # Pod icinde: /etc/alertmanager/secrets/alertmanager-telegram/token
            secrets:
              - alertmanager-telegram
            nodeSelector:
              kubernetes.io/hostname: kadirserver
          config:
            global:
              resolve_timeout: 5m
            # Telegram bildirimleri telegram-bot tarafindan yapilir (node cokme/acilma + saatlik rapor).
            # Alertmanager alertleri Alertmanager/Grafana'da kalir, chat'e dusmez.
            route:
              receiver: "null"
              group_by: ["alertname", "node"]
              group_wait: 1m
              group_interval: 30m
              repeat_interval: 8760h
              routes: []
                # Node kapandi/acildi bildirimi artik telegram-bot (helm/telegram-bot) tarafindan
                # gonderiliyor. Cift mesaj olmamasi icin bu route kapatildi.
                # - receiver: telegram
                #   matchers:
                #     - 'alertname="WorkerNodeNotReady"'
            receivers:
              - name: "null"
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                    chat_id: 8628590221
                    send_resolved: true
                    parse_mode: HTML
                    message: '{{ if eq .Status "firing" }}🔴 {{ (index .Alerts.Firing 0).Labels.node }} kapalı{{ else }}🟢 {{ (index .Alerts.Resolved 0).Labels.node }} açıldı{{ end }}'

        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            type: pvc
            storageClassName: local-path
            size: 2Gi
          nodeSelector:
            kubernetes.io/hostname: kadirserver

        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: kadirserver

        prometheusOperator:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          admissionWebhooks:
            patch:
              nodeSelector:
                kubernetes.io/hostname: kadirserver

        prometheus-node-exporter:
          tolerations:
            - operator: "Exists"

        # --- Ozel alarm kurallari ---
        additionalPrometheusRulesMap:
          homelab-alerts:
            groups:
              # ==================== NODE ALERTLERI ====================
              - name: homelab.nodes
                rules:
                  - alert: WorkerNodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true",node=~"rockyserver|wk1"} == 0
                    for: 3m
                    labels:
                      severity: critical
                    annotations:
                      summary: "🖥 {{ $labels.node }} node'u NotReady durumunda"
                      description: "Node 3 dakikadir Ready degil. Uzerindeki pod'lar baska node'a tasinabilir."

                  - alert: NodeExporterDown
                    expr: up{job="node-exporter"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "📡 {{ $labels.instance }} node-exporter'a ulasilamiyor"
                      description: "5 dakikadir metrik gelmiyor, makine kapanmis veya agdan dusmus olabilir."

                  - alert: NodeCPUHigh
                    expr: (1 - avg by(instance,node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "⚡ {{ $labels.node }} CPU kullanimi cok yuksek"
                      description: "CPU kullanimi 15 dakikadir %{{ $value | humanizePercentage }} seviyesinde."

                  - alert: NodeMemoryWarning
                    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "🧠 {{ $labels.node }} RAM kullanimi yuksek"
                      description: "RAM kullanimi %{{ $value | humanizePercentage }} (>%85, 10 dk+)."

                  - alert: NodeMemoryCritical
                    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.95
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "🧠 {{ $labels.node }} RAM kritik seviyede!"
                      description: "RAM kullanimi %{{ $value | humanizePercentage }} (>%95). OOMKill riski var."

                  - alert: NodeDiskWarning
                    expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.85
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "💾 {{ $labels.node }} disk kullanimi yuksek"
                      description: "Disk kullanimi %{{ $value | humanizePercentage }} (>%85)."

                  - alert: NodeDiskCritical
                    expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.95
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "💾 {{ $labels.node }} disk kritik seviyede!"
                      description: "Disk kullanimi %{{ $value | humanizePercentage }} (>%95). Yazma hatalari olusabilir."

              # ==================== GAMEGARAJ POD ALERTLERI ====================
              - name: homelab.gamegaraj
                rules:
                  - alert: GamegarajPodsPending
                    expr: sum by(pod) (kube_pod_status_phase{namespace="gamegaraj",phase="Pending"}) > 0
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: "⏳ {{ $labels.pod }} pod'u Pending durumunda"
                      description: "10 dakikadir schedule edilemiyor. Kaynak, taint veya PVC sorunu olabilir."

                  - alert: GamegarajReplicasUnavailable
                    expr: kube_deployment_status_replicas_unavailable{namespace="gamegaraj"} > 0
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: "🔄 {{ $labels.deployment }} deployment'inda eksik replika"
                      description: "{{ $value }} replika 10 dakikadir hazir degil."

                  - alert: GamegarajPodCrashLooping
                    expr: increase(kube_pod_container_status_restarts_total{namespace="gamegaraj"}[15m]) > 3
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "💥 {{ $labels.pod }} surekli restart ediyor"
                      description: "Son 15 dk'da {{ $value | humanize }} restart. Container: {{ $labels.container }}."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true