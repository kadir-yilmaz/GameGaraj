apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 65.2.0
    chart: kube-prometheus-stack
    helm:
      values: |
        prometheus:
          prometheusSpec:
            nodeSelector:
              kubernetes.io/hostname: kadirserver
            tolerations:
              - key: "management"
                operator: "Equal"
                value: "only"
                effect: "NoSchedule"
        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              kubernetes.io/hostname: kadirserver
            tolerations:
              - key: "management"
                operator: "Equal"
                value: "only"
                effect: "NoSchedule"
        grafana:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
        prometheusOperator:
          nodeSelector:
            kubernetes.io/hostname: kadirserver
          tolerations:
            - key: "management"
              operator: "Equal"
              value: "only"
              effect: "NoSchedule"
          admissionWebhooks:
            patch:
              nodeSelector:
                kubernetes.io/hostname: kadirserver
              tolerations:
                - key: "management"
                  operator: "Equal"
                  value: "only"
                  effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
