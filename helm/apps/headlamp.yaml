apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.45.0
    chart: headlamp
    helm:
      values: |
        nodeSelector:
          kubernetes.io/hostname: kadirserver
        tolerations:
          - key: "management"
            operator: "Equal"
            value: "only"
            effect: "NoSchedule"
        service:
          type: NodePort
          nodePort: 30444
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m