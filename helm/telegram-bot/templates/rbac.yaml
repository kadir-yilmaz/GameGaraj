apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telegram-bot.name" . }}
  labels:
    {{- include "telegram-bot.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "telegram-bot.name" . }}
  labels:
    {{- include "telegram-bot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "telegram-bot.name" . }}
  labels:
    {{- include "telegram-bot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "telegram-bot.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "telegram-bot.name" . }}
    namespace: {{ .Release.Namespace }}
