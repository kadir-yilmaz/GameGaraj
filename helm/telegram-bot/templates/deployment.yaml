apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telegram-bot.name" . }}
  labels:
    {{- include "telegram-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telegram-bot.name" . }}
  template:
    metadata:
      labels:
        {{- include "telegram-bot.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "telegram-bot.name" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/bot.py"]
          env:
            - name: TELEGRAM_CHAT_ID
              value: {{ .Values.telegram.chatId | quote }}
            - name: TELEGRAM_TOKEN_FILE
              value: /telegram/token
            - name: GAMEGARAJ_NAMESPACE
              value: {{ .Values.gamegarajNamespace | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocdNamespace | quote }}
            - name: TZ_OFFSET_HOURS
              value: {{ .Values.report.tzOffsetHours | quote }}
            - name: HOURLY_REPORT
              value: {{ .Values.report.hourly | quote }}
            - name: NODE_CHECK_INTERVAL
              value: {{ .Values.nodeWatch.intervalSeconds | quote }}
            - name: NODE_DEBOUNCE_CHECKS
              value: {{ .Values.nodeWatch.debounceChecks | quote }}
            - name: AUTO_OUT_OF_SERVICE
              value: {{ .Values.nodeWatch.autoOutOfService | quote }}
            - name: OUT_OF_SERVICE_AFTER_SECONDS
              value: {{ .Values.nodeWatch.outOfServiceAfterSeconds | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: bot
              mountPath: /app
              readOnly: true
            - name: telegram
              mountPath: /telegram
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: bot
          configMap:
            name: {{ include "telegram-bot.name" . }}
        - name: telegram
          secret:
            secretName: {{ .Values.telegram.existingSecret }}
            items:
              - key: {{ .Values.telegram.existingSecretKey }}
                path: token
