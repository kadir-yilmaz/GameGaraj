image:
  repository: ghcr.io/kadir-yilmaz/gamegaraj/telegram-bot
  tag: "cfd1ba8-11"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 80
  nodePort: 30500

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi

telegram:
  chatId: "8628590221"
  existingSecret: alertmanager-telegram
  existingSecretKey: token

gamegarajNamespace: gamegaraj
argocdNamespace: argocd

# Ilk kurulum varsayilanlari (Web UI'dan degistirilenler PVC/SQLite'ta saklanir)
report:
  intervalHours: 6
  tzOffsetHours: 3   # Europe/Istanbul (UTC+3)

oncall:
  nightStart: "22:00"
  nightEnd: "08:00"

smtp:
  existingSecret: ""

webAuth:
  existingSecret: ""

# Node cokme / acilma bildirimi
nodeWatch:
  intervalSeconds: 30
  debounceChecks: 2
  autoOutOfService: true
  outOfServiceAfterSeconds: 90

nodeSelector:
  kubernetes.io/hostname: kadirserver

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

resources:
  requests:
    cpu: 30m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi
