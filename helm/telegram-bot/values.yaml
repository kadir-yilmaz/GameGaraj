image:
  repository: python
  tag: "3.12-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

telegram:
  chatId: "8628590221"
  existingSecret: alertmanager-telegram
  existingSecretKey: token

gamegarajNamespace: gamegaraj
argocdNamespace: argocd

# Her saat basi sadece node saglik raporu
report:
  hourly: true
  tzOffsetHours: 3   # Europe/Istanbul (UTC+3)

# Node cokme / acilma bildirimi
nodeWatch:
  intervalSeconds: 30   # kontrol araligi
  debounceChecks: 2     # durum degisikligi kac ardisik kontrolde dogrulanacak (sahte alarm onler)

nodeSelector:
  kubernetes.io/hostname: kadirserver

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
