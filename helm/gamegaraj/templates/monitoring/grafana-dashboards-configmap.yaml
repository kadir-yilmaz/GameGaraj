{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "gamegaraj.labels" $ | nindent 4 }}
data:
  service-health.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate (RPS) per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count[1m])) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "pointSize": 5 }
            }
          }
        },
        {
          "title": "Latency P95 per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le, service_name))",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }} P95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          }
        },
        {
          "title": "Error Rate (5xx) per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[1m])) by (service_name) / sum(rate(http_server_request_duration_seconds_count[1m])) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.03 }
                ]
              },
              "noValue": "0% (No 5xx)"
            }
          }
        },
        {
          "title": "CPU Usage per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "rate(process_cpu_time_seconds_total[1m])",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.7 },
                  { "color": "red", "value": 0.9 }
                ]
              }
            }
          }
        },
        {
          "title": "Memory Usage per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "process_memory_usage_bytes",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "GC Collections per Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "rate(process_runtime_dotnet_gc_collections_count_total[1m])",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }} {{ "{{" }}generation{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "bars", "fillOpacity": 50 }
            }
          }
        },
        {
          "title": "ThreadPool Queue Length",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "process_runtime_dotnet_thread_pool_queue_length",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Active HTTP Connections",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "sum(http_server_active_requests) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 100 }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["gamegaraj", "service-health"],
      "templating": { "list": [] },
      "refresh": "1s",
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "GameGaraj - Service Health",
      "uid": "gamegaraj-service-health",
      "version": 3
    }
  business-metrics.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Counter: Sepete Eklenen Urunler (Rate)",
          "description": "Counter metrigi: rate() fonksiyonu counter'i saniye basina hiza donusturur.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(basket_items_added_total[5m]))",
              "legendFormat": "Sepete Ekleme/sn"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "gradientMode": "scheme" },
              "color": { "mode": "fixed", "fixedColor": "green" }
            }
          }
        },
        {
          "title": "Counter: Siparisler Olusturuldu (Rate)",
          "description": "Counter metrigi: Toplam siparis sayisinin saniye basina artis hizi.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(orders_created_total[5m]))",
              "legendFormat": "Siparis/sn",
              "exemplar": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2, "gradientMode": "scheme" },
              "color": { "mode": "fixed", "fixedColor": "blue" }
            }
          }
        },
        {
          "title": "Counter: Sepete Eklenen ve Cikarilan Urunler (Toplam)",
          "description": "Son 1 saatte sepete eklenen ve sepetten cikarilan urun adetlerini gosterir.",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(increase(basket_items_added_total[$__range]))",
              "legendFormat": "Sepete Eklenen Urunler"
            },
            {
              "expr": "sum(increase(basket_items_removed_total[$__range]))",
              "legendFormat": "Sepetten Cikarilan Urunler"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 5 },
                  { "color": "yellow", "value": 50 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Counter: Siparis Durumlari (Toplam)",
          "description": "Birden fazla counter karsilastirarak is akisinin sagligini olcebilirsiniz.",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [
            {
              "expr": "sum(increase(orders_created_total[$__range]))",
              "legendFormat": "Olusturulan"
            },
            {
              "expr": "sum(increase(orders_cancelled_total[$__range]))",
              "legendFormat": "Iptal Edilen"
            },
            {
              "expr": "sum(increase(orders_completed_total[$__range]))",
              "legendFormat": "Tamamlanan"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 1 },
                  { "color": "orange", "value": 20 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "title": "Counter: Odeme Basari vs Hata",
          "description": "Iki counter'i ayni grafikte karsilastirmak sik kullanilan bir pattern.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(payments_succeeded_total[5m]))",
              "legendFormat": "Basarili",
              "exemplar": true
            },
            {
              "expr": "sum(rate(payments_failed_total[5m]))",
              "legendFormat": "Basarisiz",
              "exemplar": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Basarili" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Basarisiz" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          }
        },
        {
          "title": "Histogram: HTTP Istek Suresi Dagilimi (P50/P95/P99)",
          "description": "Histogram metrigi: histogram_quantile() ile yuzdelik dilimler hesaplanir.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "P50 (Ortanca)"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "P99 (En Yavas)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "P50 (Ortanca)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "P95" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "P99 (En Yavas)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          }
        },
        {
          "title": "Gauge: Anlik Aktif Baglanti Sayisi",
          "description": "Gauge metrigi: Anlik deger gosterir, yukari-asagi gidebilir.",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(http_server_active_requests) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 30 },
                  { "color": "red", "value": 80 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "title": "Gauge: .NET Heap Bellek (Anlik)",
          "description": "Gauge: GC heap boyutunu anlik olarak gosterir.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 16 },
          "targets": [
            {
              "expr": "process_runtime_dotnet_gc_heap_size_bytes",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Counter: Favori Islemleri (Rate)",
          "description": "Counter: Favori ekleme ve cikarma islemlerinin hiz karsilastirmasi.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(basket_favorites_added_total[5m]))",
              "legendFormat": "Favori Eklendi"
            },
            {
              "expr": "sum(rate(basket_favorites_removed_total[5m]))",
              "legendFormat": "Favori Cikarildi"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "line", "fillOpacity": 20, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Favori Eklendi" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Favori Cikarildi" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          }
        },
        {
          "title": "Counter: HTTP Istek Hizi (Status Code Bazli)",
          "description": "Label bazli filtreleme Prometheus'un en guclu ozelliklerinden biridir.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"2..\"}[1m])) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }} 2xx"
            },
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"4..\"}[1m])) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }} 4xx"
            },
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[1m])) by (service_name)",
              "legendFormat": "{{ "{{" }}service_name{{ "}}" }} 5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Checkout Trace Exemplars",
          "description": "Siparis ve odeme counter artislarini olay aninda sutun olarak gosterir. Exemplar marker varsa Jaeger checkout trace'ine gecis icindir.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "sum(increase(orders_created_total[1m])) or vector(0)",
              "legendFormat": "Siparis olustu",
              "exemplar": true
            },
            {
              "expr": "sum(increase(payments_succeeded_total[1m])) or vector(0)",
              "legendFormat": "Odeme basarili",
              "exemplar": true
            },
            {
              "expr": "sum(increase(payments_failed_total[1m])) or vector(0)",
              "legendFormat": "Odeme basarisiz",
              "exemplar": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "bars",
                "barAlignment": 0,
                "fillOpacity": 80,
                "lineWidth": 0,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*Siparis.*" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }
                ]
              },
              {
                "matcher": { "id": "byRegexp", "options": ".*basarili.*" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }
                ]
              },
              {
                "matcher": { "id": "byRegexp", "options": ".*basarisiz.*" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["gamegaraj", "business-metrics"],
      "templating": { "list": [] },
      "refresh": "1s",
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "GameGaraj - Business Metrics",
      "uid": "gamegaraj-business-metrics",
      "version": 10
    }
  service-rps.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "GameGaraj.WebUI RPS",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"webui\",http_route!=\"/metrics\",http_route!=\"/health\"}[1m]))", "legendFormat": "Total" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"webui\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"2..\"}[1m]))", "legendFormat": "2xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"webui\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"4..\"}[1m]))", "legendFormat": "4xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"webui\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"5..\"}[1m]))", "legendFormat": "5xx" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "pointSize": 4 } } }
        },
        {
          "title": "GameGaraj.Gateway RPS",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"gateway\",http_route!=\"/metrics\",http_route!=\"/health\"}[1m]))", "legendFormat": "Total" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"gateway\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"2..\"}[1m]))", "legendFormat": "2xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"gateway\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"4..\"}[1m]))", "legendFormat": "4xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"gateway\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"5..\"}[1m]))", "legendFormat": "5xx" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "pointSize": 4 } } }
        },
        {
          "title": "GameGaraj.Catalog RPS",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "targets": [
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"catalog-api\",http_route!=\"/metrics\",http_route!=\"/health\"}[1m]))", "legendFormat": "Total" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"catalog-api\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"2..\"}[1m]))", "legendFormat": "2xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"catalog-api\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"4..\"}[1m]))", "legendFormat": "4xx" },
            { "expr": "sum(rate(http_server_request_duration_seconds_count{app=\"catalog-api\",http_route!=\"/metrics\",http_route!=\"/health\",http_response_status_code=~\"5..\"}[1m]))", "legendFormat": "5xx" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2, "pointSize": 4 } } }
        },
        {
          "title": "GameGaraj.Basket RPS",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
