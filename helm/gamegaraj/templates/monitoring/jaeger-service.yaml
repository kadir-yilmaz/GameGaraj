{{- if .Values.monitoring.enabled }}
# ClusterIP — OTLP ingestion (cluster-internal only)
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    app: jaeger
    {{- include "gamegaraj.labels" $ | nindent 4 }}
spec:
  ports:
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: ui
  selector:
    app: jaeger
---
# NodePort — Jaeger UI (external access for browser)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: jaeger
    {{- include "gamegaraj.labels" $ | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: {{ .Values.monitoring.jaeger.nodePort }}
      protocol: TCP
      name: ui
  selector:
    app: jaeger
{{- end }}
