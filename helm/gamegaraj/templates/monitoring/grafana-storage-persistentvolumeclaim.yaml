{{- if .Values.monitoring.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "gamegaraj.labels" $ | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.monitoring.grafana.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
  {{- if .Values.monitoring.grafana.persistence.storageClassName }}
  storageClassName: {{ .Values.monitoring.grafana.persistence.storageClassName | quote }}
{{- end }}
