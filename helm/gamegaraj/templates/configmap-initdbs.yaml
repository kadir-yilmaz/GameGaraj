{{- if and .Values.configMaps (hasKey .Values.configMaps "initdbs") .Values.configMaps.initdbs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMaps.initdbs.name | default "gamegaraj-initdbs" }}
  labels:
    {{- include "gamegaraj.labels" . | nindent 4 }}
data:
  init-dbs.sql: |-
{{ .Values.configMaps.initdbs.data | indent 4 }}
{{- end }}