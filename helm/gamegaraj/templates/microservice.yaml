{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "gamegaraj.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  revisionHistoryLimit: {{ $svc.revisionHistoryLimit | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $svc.maxUnavailable | default 0 }}
      maxSurge: {{ $svc.maxSurge | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.global.containerPort | default 8080 }}"
        prometheus.io/path: "/metrics"
        gamegaraj.io/image: {{ $svc.image | quote }}
        {{- if and $svc.env (hasKey $svc.env "APP_VERSION") }}
        gamegaraj.io/app-version: {{ index $svc.env "APP_VERSION" | quote }}
        {{- end }}
      labels:
        app: {{ $name }}
        {{- include "gamegaraj.labels" $ | nindent 8 }}
    spec:
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if $svc.tolerations }}
      tolerations:
        {{- toYaml $svc.tolerations | nindent 8 }}
      {{- end }}
      {{- if $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $name }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $.Values.global.containerPort | default 8080 }}
              name: http
          env:
            {{- if not $svc.skipCommon }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $.Values.global.aspnetEnvironment | default "Production" | quote }}
            - name: ASPNETCORE_URLS
              value: {{ $.Values.global.aspnetUrls | default "http://+:8080" | quote }}
            {{- if not $svc.skipCommonRabbit }}
            - name: RabbitMQUrl
              value: {{ $.Values.global.rabbitmqUrl | quote }}
            {{- end }}
            - name: IdentityOption__Authority
              value: {{ $.Values.global.identityAuthority | quote }}
            - name: IdentityServerURL
              value: {{ $.Values.global.identityAuthority | quote }}
            - name: ElasticSearchSettings__Uri
              value: {{ $.Values.global.elasticUri | quote }}
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ $.Values.global.otlpEndpoint | quote }}
            - name: OpenTelemetry__SamplingRatio
              value: {{ $.Values.global.otlpSamplingRatio | default "1.0" | quote }}
            - name: OpenTelemetry__IncludeDatabaseSpans
              value: {{ $.Values.global.otlpIncludeDatabaseSpans | default "true" | quote }}
            - name: OpenTelemetry__SuppressLowValueManualSpans
              value: {{ $.Values.global.otlpSuppressLowValueManualSpans | default "true" | quote }}
            {{- end }}
            {{- if $svc.env }}
            {{- range $envKey, $envVal := $svc.env }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
            {{- end }}
            {{- end }}
            {{- if $svc.secretEnv }}
            {{- range $envKey, $secretKey := $svc.secretEnv }}
            - name: {{ $envKey }}
              valueFrom:
                secretKeyRef:
                  name: gamegaraj-secrets
                  key: {{ $secretKey }}
            {{- end }}
            {{- end }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            {{- toYaml $svc.livenessProbe | nindent 12 }}
          {{- else if not $svc.disableDefaultProbes }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/healthz" }}
              port: {{ $.Values.global.containerPort | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml $svc.readinessProbe | nindent 12 }}
          {{- else if not $svc.disableDefaultProbes }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/healthz" }}
              port: {{ $.Values.global.containerPort | default 8080 }}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gamegaraj.labels" $ | nindent 4 }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  {{- if $svc.sessionAffinity }}
  sessionAffinity: {{ $svc.sessionAffinity }}
  {{- end }}
  selector:
    app: {{ $name }}
  ports:
    - protocol: TCP
      port: {{ $.Values.global.containerPort | default 8080 }}
      targetPort: {{ $.Values.global.containerPort | default 8080 }}
      name: http
      {{- if and $svc.nodePort (eq ($svc.serviceType | default "ClusterIP") "NodePort") }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
{{- end }}