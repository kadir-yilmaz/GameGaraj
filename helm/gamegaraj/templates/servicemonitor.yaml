apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gamegaraj.fullname" . }}-metrics
  labels:
    {{- include "gamegaraj.labels" . | nindent 4 }}
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: gamegaraj
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
